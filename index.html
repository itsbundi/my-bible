<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>My Bible</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F4F6">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A personal Bible with a daily verse, reading plans, highlights and notes. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Bible">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" href="newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout: native-app shell — translucent sticky top bar, large titles, one reading column (max 40rem),
   floating action bar for selected verses, fixed tab bar. One bold moment: the sky-gradient verse of the day. */
@font-face{font-family:"Newsreader";src:url("newsreader.woff2") format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url("newsreader-italic.woff2") format("woff2");font-weight:200 800;font-style:italic;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("instrument-sans.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
:root{
  --bg:#F5F4F6; --surface:#FFFFFF; --surface-2:#ECEBEF; --ink:#18161D; --muted:#6E6B77; --line:rgba(24,22,29,.09);
  --accent:#A3203A; --accent-2:#C8344F; --on-accent:#FFFFFF; --accent-wash:rgba(163,32,58,.09); --gold:#B98420; --gold-wash:rgba(185,132,32,.14);
  --hl-gold:#F8E39A; --hl-rose:#F7C9D2; --hl-sage:#CDE7D1; --hl-sky:#CADDF6;
  --bar:rgba(245,244,246,.82); --scrim:rgba(14,12,18,.42); --shadow:0 12px 40px rgba(24,22,29,.16); --shadow-sm:0 1px 2px rgba(24,22,29,.06),0 4px 14px rgba(24,22,29,.05);
  --f-serif:"Newsreader","Iowan Old Style","New York",Georgia,serif;
  --f-ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --read-size:19px; --read-lh:1.65; --tabbar:60px; --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D11; --surface:#18171D; --surface-2:#232129; --ink:#EFEDF3; --muted:#9C99A6; --line:rgba(255,255,255,.08);
  --accent:#F07A8E; --accent-2:#F5949F; --on-accent:#1A0B10; --accent-wash:rgba(240,122,142,.12); --gold:#E3B65A; --gold-wash:rgba(227,182,90,.14);
  --hl-gold:#4F4116; --hl-rose:#552331; --hl-sage:#21402A; --hl-sky:#1C3252;
  --bar:rgba(14,13,17,.8); --scrim:rgba(0,0,0,.55); --shadow:0 12px 40px rgba(0,0,0,.55); --shadow-sm:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0D11; --surface:#18171D; --surface-2:#232129; --ink:#EFEDF3; --muted:#9C99A6; --line:rgba(255,255,255,.08);
  --accent:#F07A8E; --accent-2:#F5949F; --on-accent:#1A0B10; --accent-wash:rgba(240,122,142,.12); --gold:#E3B65A; --gold-wash:rgba(227,182,90,.14);
  --hl-gold:#4F4116; --hl-rose:#552331; --hl-sage:#21402A; --hl-sky:#1C3252;
  --bar:rgba(14,13,17,.8); --scrim:rgba(0,0,0,.55); --shadow:0 12px 40px rgba(0,0,0,.55); --shadow-sm:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 28px);
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}
.wrap{max-width:40rem;margin:0 auto}
.sc{font-variant:small-caps;letter-spacing:.03em}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(12px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .inner{max-width:41rem;margin:0 auto;height:52px;display:flex;align-items:center;gap:6px}
.top .ttl{flex:1;min-width:0;text-align:center;font-weight:600;font-size:16px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.scrolled .ttl{opacity:1}
.top .side{width:88px;display:flex;gap:2px}
.top .side.r{justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:active{background:var(--surface-2)}
.ib:disabled{opacity:.3}
.ib svg{width:22px;height:22px}
.refpill{flex:1;min-width:0;height:38px;border:0;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--f-serif);font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;padding:0 12px}
.refpill span{overflow:hidden;text-overflow:ellipsis}
.refpill svg{width:14px;height:14px;opacity:.55;flex:none}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .1s linear}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .inner{max-width:30rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.tab svg{width:24px;height:24px;transition:transform .2s}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.05)}

/* ---------- views ---------- */
.view{animation:vin .28s ease both}
@keyframes vin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-serif);font-weight:500;font-size:clamp(32px,9vw,42px);line-height:1.05;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.big em{font-style:italic;color:var(--accent)}
.lt{padding-top:10px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:20px}
h2,h3{margin:0;font-weight:500;text-wrap:balance}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
.card h2{font-family:var(--f-serif);font-size:23px;line-height:1.15}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{height:44px;padding:0 18px;border-radius:14px;border:0;background:var(--surface-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:11px}
.btn.glass{background:rgba(255,255,255,.18);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.glass.solid{background:#fff;color:#1b1420}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px 18px;color:#fff;min-height:280px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.hero .orb{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
.hero .stars{position:absolute;inset:0;pointer-events:none;opacity:.8}
.hero > *:not(.orb):not(.stars){position:relative}
.hero .eyebrow{color:rgba(255,255,255,.78)}
.hero blockquote{margin:auto 0 0;padding-top:26px;font-family:var(--f-serif);font-style:italic;font-size:clamp(22px,6vw,27px);line-height:1.35;letter-spacing:-.005em;text-wrap:pretty;text-shadow:0 1px 18px rgba(0,0,0,.18)}
.hero .ref{margin-top:12px;font-weight:600;font-size:14px;letter-spacing:.04em;color:rgba(255,255,255,.88)}
.hero .row{margin-top:16px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(10,6,20,.28);color:#fff}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--on-accent)}
.day i svg{width:14px;height:14px}
.day.on i{background:var(--gold);color:#fff}
.day.today{color:var(--ink)}
.day.today i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.streak{font-family:var(--f-serif);font-size:30px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}

.cont{display:flex;align-items:center;gap:14px;text-align:left;border:0;width:100%;color:inherit;font:inherit}
.ring{flex:none;width:54px;height:54px;position:relative}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cont .t{flex:1;min-width:0}
.cont h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont p{margin:4px 0 0;font-family:var(--f-serif);font-style:italic;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chev{color:var(--muted);flex:none}
.chev svg{width:20px;height:20px}

.bar{height:8px;border-radius:4px;background:var(--gold-wash);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--gold);transition:width .4s}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--gold-wash);color:var(--gold)}
.pill.warn{background:var(--accent-wash);color:var(--accent)}
.list{display:flex;flex-direction:column;margin-top:10px}
.li{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:#fff;transition:background .2s,border-color .2s}
.ck svg{width:15px;height:15px}
.ck.on{background:var(--gold);border-color:var(--gold)}
.li .go{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;text-align:left;height:52px;padding:0;font-family:var(--f-serif);font-size:19px}
.li .go.done{color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.opt b{display:block;font-weight:600}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.install{display:flex;gap:14px;align-items:center}
.install img{width:52px;height:52px;border-radius:13px;flex:none}

/* chips, fields, segments */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--accent)}
.input{width:100%;min-width:0;height:48px;border-radius:14px;border:0;background:var(--surface-2);padding:0 16px;font-size:16px}
textarea.input{height:auto;min-height:130px;padding:14px 16px;font-family:var(--f-serif);font-size:17px;line-height:1.5;resize:none}
.input:focus{outline:2px solid var(--accent);outline-offset:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.searchf{position:relative}
.searchf svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.searchf .input{padding-left:42px}

/* ---------- reader ---------- */
.chapter{padding-top:18px;touch-action:pan-y}
.chead{text-align:center;margin:8px 0 26px}
.chead .bkname{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chead .num{font-family:var(--f-serif);font-weight:300;font-size:84px;line-height:.95;color:var(--accent);font-variant-numeric:lining-nums}
.text{font-family:var(--f-serif);font-size:var(--read-size);line-height:var(--read-lh);font-optical-sizing:auto}
.text.sans{font-family:var(--f-ui);font-size:calc(var(--read-size) * .94)}
.text.lines .v{display:block;position:relative;padding:3px 8px 3px 30px;margin:0 -8px 2px;border-radius:10px}
.text.lines .v sup{position:absolute;left:6px;top:.62em;width:20px;text-align:right;vertical-align:0;line-height:1}
.text.flow{text-align:left}
.text.flow .v{border-radius:4px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.v{cursor:pointer;transition:background .2s}
.v sup{font-family:var(--f-ui);font-size:.52em;font-weight:700;color:var(--accent);margin-right:4px;font-variant-numeric:tabular-nums;vertical-align:.55em}
.v[data-hl="gold"]{background:var(--hl-gold)}
.v[data-hl="rose"]{background:var(--hl-rose)}
.v[data-hl="sage"]{background:var(--hl-sage)}
.v[data-hl="sky"]{background:var(--hl-sky)}
.v.sel{text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.text.lines .v.sel{text-decoration:none;box-shadow:inset 0 0 0 2px var(--accent)}
.v.flash{background:var(--accent-wash)}
.v.speaking{background:var(--gold-wash)}
.v .bmk{display:inline-block;width:9px;height:13px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);margin-left:5px;vertical-align:.05em}
.v .nmk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--accent-wash);color:var(--accent);margin-left:5px;vertical-align:-.15em;border:0;padding:0}
.v .nmk svg{width:12px;height:12px}
.marg{display:block;margin:2px 0 10px 22px;padding:10px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-sm);font-family:var(--f-ui);font-size:14px;line-height:1.45;color:var(--muted);cursor:pointer}
.marg b{color:var(--accent);font-weight:600}
.cfoot{margin-top:34px;display:flex;flex-direction:column;gap:12px}
.readbtn.on{background:var(--gold-wash);color:var(--gold)}
.nextcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;padding:16px 18px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm)}
.nextcard .t{flex:1;min-width:0}
.nextcard h3{font-family:var(--f-serif);font-size:21px}
.hint{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
.nltlink{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;height:40px}
.nltlink svg{width:15px;height:15px}

/* floating action bar */
.fab{position:fixed;left:50%;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);z-index:26;transform:translate(-50%,24px);opacity:0;pointer-events:none;
  width:min(30rem,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:12px 12px 10px;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
.fab.in{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.fab .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 10px 6px}
.fab .hd b{font-family:var(--f-serif);font-size:18px;font-weight:600}
.fab .sws{display:flex;gap:10px;align-items:center;padding:0 4px 12px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);flex:none}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw.clr{background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.sw.clr svg{width:14px;height:14px}
.fab .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{height:56px;border:0;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600}
.act svg{width:20px;height:20px}
.act.on{color:var(--accent);background:var(--accent-wash)}

/* player */
.player{position:fixed;left:50%;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);z-index:24;transform:translateX(-50%);
  width:min(30rem,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.player .t{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .t span{opacity:.65;font-weight:500}
.player .ib{color:var(--bg)}
.player .ib:active{background:rgba(127,127,127,.25)}

/* search & saved */
.results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.res{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.res .r{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--accent)}
.res .r .dot{width:10px;height:10px;border-radius:50%}
.res .x{font-family:var(--f-serif);font-size:17px;line-height:1.5;margin-top:4px}
.res mark{background:var(--hl-gold);color:inherit;border-radius:3px;padding:0 2px}
.res .n{margin-top:8px;font-size:14px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty .glyph{width:64px;height:64px;border-radius:20px;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.empty .glyph svg{width:28px;height:28px}
.empty h3{font-family:var(--f-serif);font-size:23px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 auto 16px;max-width:22rem}
.count{font-size:13px;color:var(--muted);margin-top:14px}

/* you */
.prof{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-family:var(--f-serif);font-size:28px;font-weight:500;background:linear-gradient(150deg,#C8344F,#6B1A3F)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-family:var(--f-serif);font-weight:500;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.set{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0;padding-top:4px}
.set .lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.set .lab span{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.sample{font-family:var(--f-serif);font-size:var(--read-size);line-height:var(--read-lh);margin:0}
.sample.sans{font-family:var(--f-ui)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .25s}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;
  background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.in{transform:none}
.sheet.tall{height:calc(100% - env(safe-area-inset-top,0px) - 24px)}
.sheet .grab{flex:none;padding:10px 0 6px;touch-action:none}
.sheet .grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet .body{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet .body > .wrap{max-width:36rem}
.sheet h3{font-family:var(--f-serif);font-size:26px}
.sheet .q{font-family:var(--f-serif);font-size:16px;line-height:1.5;color:var(--muted);margin:6px 0 14px;max-height:6em;overflow:auto}
.books{display:flex;flex-direction:column;margin-top:10px}
.bk{display:flex;align-items:center;justify-content:space-between;gap:10px;height:50px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:0 4px;font-family:var(--f-serif);font-size:19px}
.bk span{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.bk.cur{color:var(--accent)}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:14px}
.ch{height:54px;border-radius:14px;border:0;background:var(--surface-2);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;position:relative}
.ch.read::after{content:"";position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.ch.cur{background:var(--accent);color:var(--on-accent)}

/* onboarding */
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(22px,env(safe-area-inset-left,0px))}
.ob .wrap{width:100%;max-width:30rem;flex:1;display:flex;flex-direction:column}
.ob .dots{display:flex;gap:6px}
.ob .dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.ob .dots i.on{background:var(--accent)}
.ob .mark{width:76px;height:76px;border-radius:20px;margin:42px 0 22px;box-shadow:var(--shadow)}
.ob h1{font-family:var(--f-serif);font-weight:500;font-size:clamp(34px,10vw,44px);line-height:1.05;letter-spacing:-.01em;margin:30px 0 10px;text-wrap:balance}
.ob h1 em{color:var(--accent)}
.ob p.lead{font-size:17px;color:var(--muted);margin:0 0 22px;max-width:26rem}
.ob .foot{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:8px}
.ob .skip{background:none;border:0;height:40px;color:var(--muted);font-weight:600}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-30px);opacity:0;z-index:70;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.in{opacity:1;transform:translate(-50%,0)}
.skel{display:block;height:1em;border-radius:6px;background:rgba(255,255,255,.25);margin:.45em 0}
.card .skel,.chapter .skel{background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top" id="top"><div class="inner" id="topInner"></div><div class="prog" id="prog"></div></header>
<main class="wrap" id="main">
  <section id="v-today" class="view"></section>
  <section id="v-read" class="view" hidden></section>
  <section id="v-search" class="view" hidden></section>
  <section id="v-saved" class="view" hidden></section>
  <section id="v-me" class="view" hidden></section>
</main>
<div class="fab" id="fab" role="toolbar" aria-label="Selected verses"></div>
<div class="player" id="player" hidden></div>
<nav class="tabs" aria-label="Sections"><div class="inner" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
"use strict";
const ic = (p, w=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  today: ic('<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>'),
  read: ic('<path d="M2.5 5.5C5 4 8.5 4 12 6c3.5-2 7-2 9.5-.5V19c-2.5-1.5-6-1.5-9.5.5-3.5-2-7-2-9.5-.5z"/><path d="M12 6v13.5"/>'),
  search: ic('<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'),
  saved: ic('<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/>'),
  me: ic('<circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.6-3.8 4.5-5.5 8-5.5s6.4 1.7 8 5.5"/>'),
  prev: ic('<path d="m15 18-6-6 6-6"/>',2.2), next: ic('<path d="m9 18 6-6-6-6"/>',2.2), down: ic('<path d="m6 9 6 6 6-6"/>',2.4),
  aa: ic('<path d="M3 19 8 6l5 13M4.8 14.5h6.4M15 19l3.5-9 3.5 9M16 16.5h5"/>'),
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>',
  listen: ic('<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'),
  check: ic('<path d="m5 12.5 4.5 4.5L19 7.5"/>',3), x: ic('<path d="M6 6l12 12M18 6 6 18"/>',2.2),
  note: ic('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>'),
  copy: ic('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>'),
  share: ic('<path d="M12 3v12"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 12v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12"/>'),
  ext: ic('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  flame: ic('<path d="M12 21c-4 0-7-2.7-7-6.6 0-3.2 2.3-5.4 3.8-7 .4 1.9 1.4 3 2.4 3.4C11 7.5 12.4 5 15 3c-.2 3 1.3 4.6 2.6 6.2C18.6 10.5 19 12 19 14.4 19 18.3 16 21 12 21z"/>'),
  download: ic('<path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/>'),
  upload: ic('<path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 20h14"/>'),
  sparkle: ic('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>'),
};

/* ---------- canon & content ---------- */
const NT = 39;
const TOPICS = ["Peace","Strength","Wisdom","Hope","Love","Faith","Gratitude"];
const VOTD = [
 [18,46,10,"Peace"],[22,26,3,"Peace"],[42,14,27,"Peace"],[42,16,33,"Peace"],[49,4,6,"Peace"],[49,4,7,"Peace"],[18,55,22,"Peace"],[59,5,7,"Peace"],[39,11,28,"Peace"],[18,23,1,"Peace"],[3,6,24,"Peace"],
 [5,1,9,"Strength"],[18,46,1,"Strength"],[22,40,31,"Strength"],[22,41,10,"Strength"],[49,4,13,"Strength"],[4,31,6,"Strength"],[46,12,9,"Strength"],[15,8,10,"Strength"],[34,3,19,"Strength"],[18,27,1,"Strength"],[54,1,7,"Strength"],[22,43,2,"Strength"],
 [19,3,5,"Wisdom"],[19,3,6,"Wisdom"],[19,16,3,"Wisdom"],[58,1,5,"Wisdom"],[18,119,105,"Wisdom"],[44,12,2,"Wisdom"],[50,3,23,"Wisdom"],[20,3,1,"Wisdom"],[32,6,8,"Wisdom"],[39,6,33,"Wisdom"],
 [23,29,11,"Hope"],[44,8,28,"Hope"],[44,15,13,"Hope"],[24,3,22,"Hope"],[24,3,23,"Hope"],[65,21,4,"Hope"],[18,121,2,"Hope"],[40,10,27,"Hope"],[41,1,37,"Hope"],[18,37,4,"Hope"],
 [42,3,16,"Love"],[45,13,4,"Love"],[45,16,14,"Love"],[61,4,19,"Love"],[35,3,17,"Love"],[48,3,20,"Love"],[18,139,14,"Love"],[47,5,22,"Love"],
 [48,2,8,"Faith"],[57,11,1,"Faith"],[42,14,6,"Faith"],[42,8,12,"Faith"],[42,15,5,"Faith"],[46,5,17,"Faith"],[39,28,20,"Faith"],[57,13,8,"Faith"],[18,34,8,"Faith"],[18,91,1,"Faith"],[39,5,14,"Faith"],[61,1,9,"Faith"],
 [18,118,24,"Gratitude"],[18,103,2,"Gratitude"],[51,5,18,"Gratitude"],[49,4,19,"Gratitude"],[18,136,1,"Gratitude"],[18,100,4,"Gratitude"]
];
const PLANS = {
  year:{name:"The whole Bible in a year",short:"Whole Bible · 1 year",days:365,from:0,to:65},
  nt90:{name:"New Testament in 90 days",short:"New Testament · 90 days",days:90,from:39,to:65},
  gospels:{name:"The four Gospels in 30 days",short:"Gospels · 30 days",days:30,from:39,to:42},
  wisdom:{name:"Psalms & Proverbs in 60 days",short:"Psalms & Proverbs · 60 days",days:60,from:18,to:19},
};
const HL = ["gold","rose","sage","sky"];
const FRAMED = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);

/* ---------- state ---------- */
const LS_KEY = "mybible.v2", OLD_KEY = "mybible.bsb.v1";
const blank = () => ({v:2,updated:0,onboarded:false,profile:{name:"",topics:[]},prefs:{size:19,lh:1.65,font:"serif",theme:"system",layout:"lines",rate:1},
  last:{b:42,c:1},hl:{},bm:{},notes:{},read:{},days:{},plan:null,recent:[],installHidden:false});
function hydrate(o){ const d=blank(); if(!o||typeof o!=="object") return d;
  return {...d,...o,profile:{...d.profile,...(o.profile||{})},prefs:{...d.prefs,...(o.prefs||{})},last:{...d.last,...(o.last||{})},
    hl:o.hl||{},bm:o.bm||{},notes:o.notes||{},read:o.read||{},days:o.days||{},recent:Array.isArray(o.recent)?o.recent:[]}; }
let S = blank();
try{ const raw = localStorage.getItem(LS_KEY) || localStorage.getItem(OLD_KEY); if(raw){ S = hydrate(JSON.parse(raw)); if(S.profile.name || S.plan) S.onboarded = true; } }catch(e){}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function commit(){ S.updated = Date.now(); saveLocal(); scheduleCloud(); }

/* optional sync when running inside Claude */
let cloud = {ref:null, ok:false, writing:false, dirty:false, lastJSON:"", timer:0};
function scheduleCloud(){ if(!cloud.ref) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 700); }
async function pushCloud(){
  if(!cloud.ref) return; if(cloud.writing){ cloud.dirty=true; return; }
  cloud.writing=true; cloud.dirty=false; const body=JSON.parse(JSON.stringify(S)); cloud.lastJSON=JSON.stringify(body);
  try{ await cloud.ref.set(body); cloud.ok=true; }catch(e){ if(!e || e.code!=="unavailable"){ cloud.ref=null; cloud.ok=false; } }
  cloud.writing=false; if(cloud.dirty) pushCloud();
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=="function") return;
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!user || !db) return; const id = await user.id(); if(!id) return;
    const ref = db.doc("data/users/"+id+"/state"); let first=true;
    ref.onSnapshot(snap => {
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists){ if(!snap.metadata.fromCache && first){ first=false; cloud.ref=ref; cloud.ok=true; if(S.updated) pushCloud(); } return; }
      const data=snap.data(), js=JSON.stringify(data); cloud.ref=ref; cloud.ok=true;
      if(first && !snap.metadata.fromCache){ first=false; if((S.updated||0) > (data.updated||0)){ pushCloud(); return; } }
      if(js===cloud.lastJSON) return;
      if((data.updated||0) >= (S.updated||0)){ S=hydrate(data); saveLocal(); applyPrefs(); if(S.onboarded) closeOnboarding(); renderAll(); }
    }, () => { cloud.ref=null; cloud.ok=false; });
  }catch(e){}
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dstr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dstr(new Date());
const dayNum = s => { const [y,m,d]=s.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const key = (b,c,v) => v==null ? b+"."+c : b+"."+c+"."+v;
const parseKey = k => k.split(".").map(Number);
let BIBLE = null, loadErr = "";
const bname = b => BIBLE ? BIBLE[b][0] : "";
const ref = (b,c,v) => bname(b)+" "+c+(v?":"+v:"");
const vtext = (b,c,v) => { try{ return BIBLE[b][1][c-1][v-1]||""; }catch(e){ return ""; } };
const nch = b => BIBLE[b][1].length;
const nltUrl = (b,c,v) => "https://www.biblegateway.com/passage/?version=NLT&search=" + encodeURIComponent(ref(b,c,v));
const fmt = t => esc(t).replace(/\bLORD\b/g,'<span class="sc">Lord</span>').replace(/\bGOD\b/g,'<span class="sc">God</span>');
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("in"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("in"),1900); }
function copyText(text){
  const fb=()=>{ const ta=document.createElement("textarea"); ta.value=text; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy");}catch(e){} ta.remove(); toast(ok?"Copied":"Couldn't copy on this device"); };
  try{ navigator.clipboard.writeText(text).then(()=>toast("Copied"),fb); }catch(e){ fb(); }
}
function shareText(text){
  if(navigator.share && !FRAMED){ navigator.share({text}).catch(()=>{}); } else copyText(text);
}
function rangeLabel(b,c,vs){
  const a=[...vs].sort((x,y)=>x-y); const parts=[]; let s=a[0], p=a[0];
  for(let i=1;i<=a.length;i++){ if(a[i]===p+1){ p=a[i]; continue; } parts.push(s===p?""+s:s+"–"+p); s=p=a[i]; }
  return bname(b)+" "+c+":"+parts.join(", ");
}
function passageText(b,c,vs){ const a=[...vs].sort((x,y)=>x-y); return a.map(v=>(a.length>1?v+" ":"")+vtext(b,c,v)).join(" ")+"\n— "+rangeLabel(b,c,a)+" (BSB)"; }

/* ---------- plans & stats ---------- */
function planList(id){ const p=PLANS[id], out=[]; for(let b=p.from;b<=p.to;b++) for(let c=1;c<=nch(b);c++) out.push([b,c]); return out; }
function portion(id,day){ const L=planList(id), D=PLANS[id].days; return L.slice(Math.floor(day*L.length/D), Math.floor((day+1)*L.length/D)); }
function planStatus(){
  if(!S.plan||!PLANS[S.plan.id]||!BIBLE) return null;
  const id=S.plan.id, D=PLANS[id].days, L=planList(id), done=L.filter(([b,c])=>S.read[key(b,c)]).length;
  let day=0; while(day<D && portion(id,day).every(([b,c])=>S.read[key(b,c)])) day++;
  const sched=Math.min(D-1,Math.max(0,dayNum(today())-dayNum(S.plan.start)));
  return {id,D,total:L.length,done,day,sched,behind:Math.max(0,sched-day),finished:day>=D};
}
function streak(){ let n=0, d=new Date(); if(!S.days[dstr(d)]) d.setDate(d.getDate()-1); while(S.days[dstr(d)]){ n++; d.setDate(d.getDate()-1); } return n; }
function setRead(b,c,on){ const k=key(b,c); if(on){ S.read[k]=today(); S.days[today()]=(S.days[today()]||0)+1; } else delete S.read[k]; commit(); }
function votd(){
  const base=VOTD.filter(x=>vtext(x[0],x[1],x[2]));
  const pool=S.profile.topics.length?base.filter(x=>S.profile.topics.includes(x[3])):base;
  const P=pool.length?pool:base; return P[dayNum(today())%P.length];
}

/* ---------- routing ---------- */
const VIEWS=[["today","Today"],["read","Read"],["search","Search"],["saved","Saved"],["me","You"]];
let view="today";
function go(v){ if(!VIEWS.some(x=>x[0]===v)) v="today"; const changed=v!==view; view=v;
  VIEWS.forEach(([id])=>{ const el=$("#v-"+id); el.hidden=id!==v; if(id===v && changed){ el.classList.remove("view"); void el.offsetWidth; el.classList.add("view"); } });
  clearSel(); renderTabs(); renderTop(); renderView(v); onScroll(); }
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h && h!==view){ go(h); window.scrollTo(0,0); } });
function nav(v){ if(location.hash.slice(1)!==v){ try{ location.hash=v; }catch(e){ go(v); } if(location.hash.slice(1)!==v) go(v); } else go(v); }

/* ---------- chrome ---------- */
function renderTabs(){ $("#tabs").innerHTML=VIEWS.map(([id,l])=>`<button class="tab" data-act="tab" data-v="${id}" ${view===id?'aria-current="page"':''}>${I[id]}<span>${l}</span></button>`).join(""); }
function renderTop(){
  const el=$("#topInner"); const top=$("#top");
  if(view==="read" && BIBLE){
    const {b,c}=S.last, first=b===0&&c===1, last=b===65&&c===nch(65);
    top.classList.add("reader");
    el.innerHTML=`<div class="side"><button class="ib" data-act="prev" aria-label="Previous chapter" ${first?"disabled":""}>${I.prev}</button></div>
      <button class="refpill" data-act="picker" aria-label="Choose book and chapter"><span>${esc(ref(b,c))}</span>${I.down}</button>
      <div class="side r"><button class="ib" data-act="listen" aria-label="Listen to this chapter">${I.listen}</button><button class="ib" data-act="textsheet" aria-label="Reading settings">${I.aa}</button></div>`;
  } else {
    top.classList.remove("reader");
    const t=(VIEWS.find(x=>x[0]===view)||[])[1];
    el.innerHTML=`<div class="side"></div><div class="ttl">${view==="today"?"My Bible":esc(t)}</div><div class="side r"></div>`;
  }
}
function onScroll(){
  const y=window.scrollY; $("#top").classList.toggle("scrolled", y>30 || view==="read");
  const p=$("#prog");
  if(view==="read"){ const h=document.documentElement.scrollHeight-innerHeight; p.style.width=(h>0?Math.min(100,y/h*100):0)+"%"; } else p.style.width="0";
}
window.addEventListener("scroll",onScroll,{passive:true});
function renderView(v){ ({today:renderToday,read:renderRead,search:renderSearch,saved:renderSaved,me:renderMe})[v](); }
function renderAll(){ renderTabs(); renderTop(); renderView(view); }

/* ---------- Today ---------- */
function sky(){
  const h=new Date().getHours();
  if(h>=5&&h<11) return {name:"morning",greet:"Good morning",bg:"linear-gradient(160deg,#F2A77C 0%,#DB6479 52%,#8C2D5E 100%)",orb:"radial-gradient(circle,#FFE6B8 0%,rgba(255,214,150,.0) 70%)",star:false};
  if(h>=11&&h<17) return {name:"day",greet:"Good afternoon",bg:"linear-gradient(165deg,#6A9BE0 0%,#4766C2 50%,#2A3482 100%)",orb:"radial-gradient(circle,#FFF6D8 0%,rgba(255,240,200,0) 70%)",star:false};
  if(h>=17&&h<20) return {name:"dusk",greet:"Good evening",bg:"linear-gradient(165deg,#E7896A 0%,#A6395F 48%,#3B2364 100%)",orb:"radial-gradient(circle,#FFD3A1 0%,rgba(255,190,140,0) 70%)",star:false};
  return {name:"night",greet:h<5?"Peace be with you":"Good evening",bg:"linear-gradient(165deg,#323C7A 0%,#1C1F4A 52%,#0D0E25 100%)",orb:"radial-gradient(circle,#F4F1FF 0%,rgba(230,225,255,0) 65%)",star:true};
}
const STARS = Array.from({length:26},(_,i)=>{ const x=(i*37%100), y=(i*53%60), r=(i%3?1:1.6); return `radial-gradient(${r}px ${r}px at ${x}% ${y}%,rgba(255,255,255,.9),transparent)`; }).join(",");
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(view==="today") renderToday(); });
window.addEventListener("appinstalled",()=>{ installEvt=null; S.installHidden=true; commit(); toast("Installed. Open My Bible from your home screen."); renderToday(); });
function renderToday(){
  const name=S.profile.name.trim(), sk=sky(), ps=planStatus();
  const dateTxt=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  let h=`<div class="lt"><div class="eyebrow">${esc(dateTxt)}</div><h1 class="big">${sk.greet}${name?`,<br><em>${esc(name)}</em>`:""}</h1></div><div class="stack">`;
  // hero
  if(BIBLE){ const [b,c,v,t]=votd();
    h+=`<article class="hero" style="background:${sk.bg}">${sk.star?`<div class="stars" style="background:${STARS}"></div>`:""}
      <div class="orb" style="width:260px;height:260px;right:-120px;bottom:-130px;opacity:.55;background:${sk.orb}"></div>
      <div class="row between"><span class="eyebrow">${name?"Your verse today":"Verse of the day"}</span><span class="tag">${esc(t)}</span></div>
      <blockquote>${fmt(vtext(b,c,v))}</blockquote><div class="ref">${esc(ref(b,c,v))}</div>
      <div class="row"><button class="btn sm glass solid" data-act="open" data-b="${b}" data-c="${c}" data-v="${v}">Read chapter</button>
      <button class="btn sm glass" data-act="sharev" data-b="${b}" data-c="${c}" data-v="${v}">${I.share}Share</button>
      <a class="btn sm glass" href="${nltUrl(b,c,v)}" target="_blank" rel="noopener">NLT ${I.ext}</a></div></article>`;
  } else h+=`<article class="hero" style="background:${sk.bg}"><span class="eyebrow">Verse of the day</span>${loadErr?`<p style="margin-top:auto">${esc(loadErr)}</p><div class="row"><button class="btn sm glass solid" data-act="retry">Try again</button></div>`:`<div style="margin-top:auto"><span class="skel"></span><span class="skel"></span><span class="skel" style="width:55%"></span></div>`}</article>`;
  // install
  if(!FRAMED && !STANDALONE && !S.installHidden && (installEvt || IOS)){
    h+=`<article class="card"><div class="install"><img src="icon-192.png" alt=""><div style="flex:1;min-width:0"><b>Install My Bible</b><div class="small muted">${installEvt?"Add it to your home screen. It works offline.":"Tap the Share button, then Add to Home Screen."}</div></div></div>
      <div class="row" style="margin-top:12px">${installEvt?`<button class="btn sm pri" data-act="install">Install</button>`:""}<button class="btn sm" data-act="hideinstall">Not now</button></div></article>`;
  }
  // streak week
  const st=streak(), now=new Date(), dow=(now.getDay()+6)%7, mon=new Date(now); mon.setDate(now.getDate()-dow);
  const days=Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
  h+=`<article class="card"><div class="row between"><div><div class="eyebrow">Reading streak</div><div class="row" style="gap:6px;margin-top:6px"><span class="streak">${st}</span><span class="muted">${st===1?"day":"days"}</span></div></div>
    <div style="color:${st?"var(--gold)":"var(--line)"}">${I.flame.replace('<svg','<svg width="34" height="34"')}</div></div>
    <div class="week">${days.map((d,i)=>{ const ds=dstr(d), on=!!S.days[ds], isT=ds===today(); return `<div class="day ${on?"on":""} ${isT?"today":""}"><span>${"MTWTFSS"[i]}</span><i>${on?I.check:""}</i></div>`; }).join("")}</div>
    <p class="small muted" style="margin:12px 0 0">${S.days[today()]?"You've read today. Keep it going tomorrow.":"Mark a chapter as read to keep your streak."}</p></article>`;
  // continue
  if(BIBLE){ const {b,c}=S.last, tot=nch(b), rd=Array.from({length:tot},(_,i)=>S.read[key(b,i+1)]?1:0).reduce((a,x)=>a+x,0), pct=rd/tot, C=2*Math.PI*23;
    h+=`<button class="card cont" data-act="open" data-b="${b}" data-c="${c}"><div class="ring"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="var(--surface-2)" stroke-width="5"/><circle cx="27" cy="27" r="23" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><b>${Math.round(pct*100)}%</b></div>
      <div class="t"><div class="eyebrow">Continue reading</div><h2>${esc(ref(b,c))}</h2><p>${fmt(vtext(b,c,1)||vtext(b,c,2))}</p></div><span class="chev">${I.next}</span></button>`;
  }
  // plan
  if(BIBLE){
    if(ps && ps.finished){
      h+=`<article class="card"><div class="eyebrow">Reading plan</div><h2 style="margin-top:4px">You finished ${esc(PLANS[ps.id].name)}</h2><p class="small muted">All ${ps.total} chapters read. Pick another plan under You.</p><div class="bar"><i style="width:100%"></i></div></article>`;
    } else if(ps){
      const items=portion(ps.id,ps.day), pct=Math.round(ps.done/ps.total*100);
      h+=`<article class="card"><div class="row between"><span class="eyebrow">${esc(PLANS[ps.id].short)}</span>${ps.behind?`<span class="pill warn">${ps.behind} day${ps.behind>1?"s":""} behind</span>`:`<span class="pill">On track</span>`}</div>
        <h2 style="margin-top:6px">Day ${ps.day+1} of ${ps.D}</h2>
        <div class="list">${items.map(([b,c])=>{ const on=!!S.read[key(b,c)]; return `<div class="li"><button class="ck ${on?"on":""}" data-act="toggleread" data-b="${b}" data-c="${c}" aria-pressed="${on}" aria-label="Mark ${esc(ref(b,c))} as read">${on?I.check:""}</button>
          <button class="go ${on?"done":""}" data-act="open" data-b="${b}" data-c="${c}"><span>${esc(ref(b,c))}</span><span class="chev">${I.next}</span></button></div>`; }).join("")}</div>
        <div class="bar"><i style="width:${pct}%"></i></div><p class="small muted" style="margin:8px 0 0">${ps.done} of ${ps.total} chapters · ${pct}%</p></article>`;
    } else {
      h+=`<article class="card"><div class="eyebrow">Reading plan</div><h2 style="margin-top:4px">Read a little every day</h2><p class="small muted" style="margin:6px 0 0">Each day you'll get a few chapters to read and tick off.</p>
        <div class="opts">${planOpts("startplan")}</div></article>`;
    }
  }
  $("#v-today").innerHTML=h+`</div>`;
}
function planOpts(act, cur){ return Object.entries(PLANS).map(([id,p])=>{ const n=planList(id).length; return `<button class="opt" data-act="${act}" data-id="${id}" aria-pressed="${cur===id}"><div><b>${esc(p.name)}</b><span>${n} chapters · about ${Math.ceil(n/p.days)} a day</span></div><span class="chev">${I.next}</span></button>`; }).join(""); }

/* ---------- Reader ---------- */
let sel=new Set();
function renderRead(){
  const el=$("#v-read");
  if(!BIBLE){ el.innerHTML=`<div class="chapter">${loadErr?`<div class="empty"><h3>The text didn't load</h3><p>${esc(loadErr)}</p><button class="btn pri" data-act="retry">Try again</button></div>`:'<span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel" style="width:70%"></span>'}</div>`; return; }
  const {b,c}=S.last, vs=BIBLE[b][1][c-1], isRead=!!S.read[key(b,c)], P=S.prefs;
  const cls="text "+(P.layout==="flow"?"flow":"lines")+(P.font==="sans"?" sans":"");
  let h=`<div class="chapter" id="chapter"><div class="chead"><div class="bkname">${esc(bname(b))}</div><div class="num">${c}</div></div><div class="${cls}">`;
  vs.forEach((t,i)=>{ if(!t) return; const v=i+1,k=key(b,c,v),hl=S.hl[k],n=S.notes[k];
    h+=`<span class="v${sel.has(v)?" sel":""}" data-act="verse" data-v="${v}" id="v${v}" ${hl?`data-hl="${hl.c}"`:""}><sup>${v}</sup>${fmt(t)}${S.bm[k]?'<span class="bmk" aria-label="Bookmarked"></span>':""}${n&&P.layout==="flow"?`<button class="nmk" data-act="opennote" data-v="${v}" aria-label="Open note">${I.note}</button>`:""}</span>${P.layout==="flow"?" ":""}${n&&P.layout!=="flow"?`<span class="marg" data-act="opennote" data-v="${v}"><b>Note</b> · ${esc(n.t)}</span>`:""}`; });
  const nx = (b<65||c<nch(b)) ? (c<nch(b)?[b,c+1]:[b+1,1]) : null;
  h+=`</div><div class="cfoot"><button class="btn block readbtn ${isRead?"on":""}" data-act="markread">${isRead?I.check+"Read":"Mark as read"}</button>
    ${nx?`<button class="nextcard" data-act="open" data-b="${nx[0]}" data-c="${nx[1]}"><div class="t"><div class="eyebrow">Next</div><h3>${esc(ref(nx[0],nx[1]))}</h3></div><span class="chev">${I.next}</span></button>`:""}
    <a class="nltlink" href="${nltUrl(b,c)}" target="_blank" rel="noopener">Read ${esc(ref(b,c))} in the NLT ${I.ext}</a>
    <p class="hint">Tap verses to highlight, note or share. Swipe sideways to change chapter.</p></div></div>`;
  el.innerHTML=h;
}
function openChapter(b,c,v){
  stopListen(); clearSel(); S.last={b,c}; commit();
  if(view!=="read") nav("read"); else { renderTop(); renderRead(); }
  requestAnimationFrame(()=>{ if(v){ const e=document.getElementById("v"+v); if(e){ window.scrollTo(0,Math.max(0,e.getBoundingClientRect().top+scrollY-120)); e.classList.add("flash"); setTimeout(()=>e.classList.remove("flash"),1800);} } else window.scrollTo(0,0); onScroll(); });
}
function step(d){ let {b,c}=S.last; c+=d; if(c<1){ if(b===0) return; b--; c=nch(b); } else if(c>nch(b)){ if(b===65) return; b++; c=1; } buzz(); openChapter(b,c); }
// swipe
let tx=0,ty=0,tt=0,tracking=false;
document.addEventListener("touchstart",e=>{ if(view!=="read"||sheetEl||e.touches.length!==1) return; if(!e.target.closest("#chapter")) return; tracking=true; tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now(); },{passive:true});
document.addEventListener("touchend",e=>{ if(!tracking) return; tracking=false; const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Date.now()-tt<700 && Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*2 && !String(getSelection()||"")) step(dx<0?1:-1); },{passive:true});

/* selection + floating bar */
function clearSel(){ if(!sel.size) return; sel.clear(); document.querySelectorAll(".v.sel").forEach(e=>e.classList.remove("sel")); renderFab(); }
function renderFab(){
  const f=$("#fab");
  if(!sel.size || view!=="read"){ f.classList.remove("in"); return; }
  const {b,c}=S.last, ks=[...sel].map(v=>key(b,c,v));
  const hlc = ks.every(k=>S.hl[k]&&S.hl[k].c===(S.hl[ks[0]]||{}).c) ? (S.hl[ks[0]]||{}).c : null;
  const anyHl = ks.some(k=>S.hl[k]), allBm = ks.every(k=>S.bm[k]);
  f.innerHTML=`<div class="hd"><b>${esc(rangeLabel(b,c,sel))}</b><button class="ib" data-act="clearsel" aria-label="Clear selection">${I.x}</button></div>
    <div class="sws" role="group" aria-label="Highlight">${HL.map(cn=>`<button class="sw" style="background:var(--hl-${cn})" data-act="hl" data-c="${cn}" aria-pressed="${hlc===cn}" aria-label="Highlight ${cn}"></button>`).join("")}${anyHl?`<button class="sw clr" data-act="hl" data-c="" aria-label="Remove highlight">${I.x}</button>`:""}</div>
    <div class="acts"><button class="act ${allBm?"on":""}" data-act="bm">${I.saved}${allBm?"Saved":"Bookmark"}</button><button class="act" data-act="opennote" data-v="${Math.min(...sel)}">${I.note}Note</button>
    <button class="act" data-act="copysel">${I.copy}Copy</button><button class="act" data-act="sharesel">${I.share}Share</button></div>`;
  f.classList.add("in");
}

/* listen (speech) */
let speaking=null;
function startListen(fromV){
  if(!("speechSynthesis" in window)){ toast("Listening isn't supported on this device"); return; }
  stopListen(); const {b,c}=S.last, vs=BIBLE[b][1][c-1];
  const order=vs.map((t,i)=>t?i+1:0).filter(v=>v && v>=(fromV||1));
  speaking={b,c,order,i:0,paused:false}; renderPlayer(); speakNext();
}
function speakNext(){
  if(!speaking) return; const s=speaking;
  document.querySelectorAll(".v.speaking").forEach(e=>e.classList.remove("speaking"));
  if(s.i>=s.order.length){ stopListen(); toast("Finished "+ref(s.b,s.c)); return; }
  const v=s.order[s.i], u=new SpeechSynthesisUtterance((s.i===0?bname(s.b)+", chapter "+s.c+". ":"")+vtext(s.b,s.c,v));
  u.rate=S.prefs.rate||1; u.lang="en";
  u.onend=()=>{ if(speaking===s && !s.paused){ s.i++; speakNext(); } };
  u.onerror=()=>{ if(speaking===s && !s.paused){ s.i++; speakNext(); } };
  const e=document.getElementById("v"+v); if(e && view==="read" && S.last.b===s.b && S.last.c===s.c){ e.classList.add("speaking"); const r=e.getBoundingClientRect(); if(r.top<80||r.bottom>innerHeight-160) window.scrollTo({top:scrollY+r.top-140,behavior:"smooth"}); }
  renderPlayer(); speechSynthesis.speak(u);
}
function stopListen(){ if(!speaking) return; speaking=null; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll(".v.speaking").forEach(e=>e.classList.remove("speaking")); renderPlayer(); }
function renderPlayer(){
  const p=$("#player"); if(!speaking){ p.hidden=true; return; }
  const s=speaking, v=s.order[Math.min(s.i,s.order.length-1)];
  p.hidden=false; p.innerHTML=`<div class="t">${esc(ref(s.b,s.c))} <span>· verse ${v}</span></div>
    <button class="ib" data-act="pauselisten" aria-label="${s.paused?"Resume":"Pause"}">${s.paused?I.play:I.pause}</button><button class="ib" data-act="stoplisten" aria-label="Stop">${I.x}</button>`;
}

/* ---------- Search ---------- */
let SQ={q:"",scope:"all"}, flat=null;
function buildFlat(){ flat=[]; BIBLE.forEach((bk,b)=>bk[1].forEach((ch,ci)=>ch.forEach((t,vi)=>{ if(t) flat.push([b,ci+1,vi+1,t.toLowerCase()]); }))); }
function renderSearch(){
  const el=$("#v-search");
  if(!el.querySelector("#q")){
    el.innerHTML=`<div class="lt"><h1 class="big">Search</h1></div><form id="sform" role="search" style="margin-top:16px"><div class="searchf">${I.search}<input class="input" id="q" type="search" placeholder="Words or a phrase" autocomplete="off" enterkeyhint="search" aria-label="Search the Bible"></div></form>
      <div class="chips" id="scope" style="margin-top:12px"></div><div id="results"></div>`;
    $("#sform").addEventListener("submit",e=>{ e.preventDefault(); SQ.q=$("#q").value; runSearch(true); $("#q").blur(); });
    $("#q").addEventListener("input",e=>{ clearTimeout(renderSearch.t); renderSearch.t=setTimeout(()=>{ SQ.q=e.target.value; runSearch(false); },250); });
  }
  const sc=[["all","All"],["ot","Old Testament"],["nt","New Testament"],["book",BIBLE?bname(S.last.b):"This book"]];
  $("#scope").innerHTML=sc.map(([id,l])=>`<button class="chip" data-act="scope" data-s="${id}" aria-pressed="${SQ.scope===id}">${esc(l)}</button>`).join("");
  runSearch(false);
}
function runSearch(remember){
  const out=$("#results"); if(!out) return; const q=SQ.q.trim().toLowerCase();
  if(!BIBLE){ out.innerHTML=`<div class="empty">Loading the text…</div>`; return; }
  if(q.length<3){
    const rec=S.recent.length?S.recent:["shepherd","do not be afraid","love is patient","living water"];
    out.innerHTML=`<div class="empty"><div class="glyph">${I.search}</div><h3>Find any verse</h3><p>Search all 31,000 verses. Type at least three letters.</p></div>
      <div class="eyebrow" style="margin-top:4px">${S.recent.length?"Recent":"Try"}</div><div class="chips" style="margin-top:10px">${rec.map(r=>`<button class="chip" data-act="try" data-q="${esc(r)}">${esc(r)}</button>`).join("")}</div>`;
    return;
  }
  if(!flat) buildFlat();
  const inS=b=>SQ.scope==="all"||(SQ.scope==="ot"&&b<NT)||(SQ.scope==="nt"&&b>=NT)||(SQ.scope==="book"&&b===S.last.b);
  const hits=[]; let total=0; for(const r of flat){ if(inS(r[0])&&r[3].includes(q)){ total++; if(hits.length<150) hits.push(r); } }
  if(remember && total){ S.recent=[SQ.q.trim(),...S.recent.filter(x=>x.toLowerCase()!==q)].slice(0,6); commit(); }
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  out.innerHTML= total ? `<div class="count">${total.toLocaleString()} verse${total>1?"s":""}${total>150?" · showing the first 150":""}</div><div class="results">`+hits.map(([b,c,v])=>`<button class="res" data-act="open" data-b="${b}" data-c="${c}" data-v="${v}"><div class="r">${esc(ref(b,c,v))}</div><div class="x">${esc(vtext(b,c,v)).replace(re,m=>`<mark>${m}</mark>`)}</div></button>`).join("")+`</div>`
    : `<div class="empty"><div class="glyph">${I.search}</div><h3>No verses found</h3><p>Try fewer words, or a different way of saying it.</p></div>`;
}

/* ---------- Saved ---------- */
let savedTab="hl";
const canon=(a,b)=>{ const A=parseKey(a),B=parseKey(b); return A[0]-B[0]||A[1]-B[1]||A[2]-B[2]; };
function renderSaved(){
  const el=$("#v-saved"), cnt={hl:Object.keys(S.hl).length,bm:Object.keys(S.bm).length,notes:Object.keys(S.notes).length};
  let h=`<div class="lt"><h1 class="big">Saved</h1></div><div class="seg" style="margin-top:16px">${[["hl","Highlights"],["bm","Bookmarks"],["notes","Notes"]].map(([id,l])=>`<button data-act="savedtab" data-t="${id}" aria-pressed="${savedTab===id}">${l} ${cnt[id]?`· ${cnt[id]}`:""}</button>`).join("")}</div>`;
  const st=S[savedTab], keys=Object.keys(st); if(savedTab==="hl") keys.sort(canon); else keys.sort((a,b)=>((st[b].ts||st[b].t||0)-(st[a].ts||st[a].t||0)));
  if(!BIBLE) h+=`<div class="empty">Loading…</div>`;
  else if(!keys.length){ const m={hl:[I.sparkle,"No highlights yet","Open the reader, tap a verse, and pick a colour."],bm:[I.saved,"No bookmarks yet","Tap a verse and choose Bookmark to come back to it."],notes:[I.note,"No notes yet","Tap a verse and choose Note to write what it means to you."]}[savedTab];
    h+=`<div class="empty"><div class="glyph">${m[0]}</div><h3>${m[1]}</h3><p>${m[2]}</p><button class="btn pri" data-act="tab" data-v="read">Open the reader</button></div>`; }
  else h+=`<div class="results">`+keys.map(k=>{ const [b,c,v]=parseKey(k);
    return `<button class="res" data-act="open" data-b="${b}" data-c="${c}" data-v="${v}"><div class="r">${savedTab==="hl"?`<span class="dot" style="background:var(--hl-${st[k].c})"></span>`:""}${esc(ref(b,c,v))}</div><div class="x">${fmt(vtext(b,c,v))}</div>${savedTab==="notes"?`<div class="n">${esc(st[k].t)}</div>`:""}</button>`; }).join("")+`</div>`;
  el.innerHTML=h;
}

function renderMe(){
  const el=$("#v-me"), ps=planStatus(), name=S.profile.name.trim();
  const saved=Object.keys(S.hl).length+Object.keys(S.bm).length+Object.keys(S.notes).length;
  el.innerHTML=`<div class="lt"><div class="prof"><div class="avatar">${esc((name[0]||"✦").toUpperCase())}</div><div style="min-width:0"><h1 class="big" style="font-size:32px">${name?esc(name):"You"}</h1><div class="small muted">Berean Standard Bible</div></div></div></div>
  <div class="stack">
    <div class="stats"><div class="stat"><b>${streak()}</b><span>day streak</span></div><div class="stat"><b>${Object.keys(S.read).length}</b><span>chapters</span></div><div class="stat"><b>${saved}</b><span>saved</span></div></div>
    <article class="card"><div class="eyebrow">Your name</div><form class="row" id="nameform" style="margin-top:10px;flex-wrap:nowrap"><input class="input" id="me-name" value="${esc(S.profile.name)}" placeholder="First name" maxlength="40" autocomplete="given-name"><button class="btn pri" type="submit">Save</button></form>
      <div class="eyebrow" style="margin-top:18px">Grow in</div><p class="small muted" style="margin:4px 0 10px">Your daily verse comes from these themes.</p>
      <div class="chips">${TOPICS.map(t=>`<button class="chip" data-act="topic" data-t="${t}" aria-pressed="${S.profile.topics.includes(t)}">${t}</button>`).join("")}</div></article>
    <article class="card"><div class="eyebrow">Reading plan</div><h2 style="margin-top:4px">${ps?esc(PLANS[ps.id].name):"No plan yet"}</h2>
      ${ps?`<p class="small muted" style="margin:6px 0 0">Started ${esc(new Date(S.plan.start+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}))} · ${ps.done} of ${ps.total} chapters</p>`:""}
      <div class="opts">${planOpts("pickplan", ps&&ps.id)}</div>
      ${planConfirm?`<div style="margin-top:12px;padding:14px;border-radius:14px;background:var(--surface-2)"><p style="margin:0 0 12px">Start <b>${esc(PLANS[planConfirm].name)}</b> from today? Chapters you've already read stay ticked.</p><div class="row"><button class="btn sm pri" data-act="confirmplan">Start plan</button><button class="btn sm" data-act="cancelplan">Cancel</button></div></div>`:""}
      ${ps&&!planConfirm?`<button class="btn sm" style="margin-top:12px" data-act="stopplan">Stop plan</button>`:""}</article>
    <article class="card"><div class="eyebrow" style="margin-bottom:6px">Reading</div>${textControls()}</article>
    <article class="card"><div class="eyebrow">Backup</div><p class="small muted" style="margin:6px 0 12px">${cloud.ok?"Your notes and highlights are saved to your Claude account.":"Your notes, highlights and plan are saved on this phone. Save a backup file now and then so you can restore them on a new phone."}</p>
      ${FRAMED?"":`<div class="row"><button class="btn sm" data-act="export">${I.download}Save backup</button><button class="btn sm" data-act="import">${I.upload}Restore</button></div>`}</article>
    <p class="small muted" style="text-align:center;margin:4px 12px 0">Scripture: Berean Standard Bible, public domain. NLT links open the New Living Translation (© Tyndale House) on Bible Gateway.</p>
  </div>`;
  bindRange(el);
  $("#nameform").addEventListener("submit",e=>{ e.preventDefault(); S.profile.name=$("#me-name").value.trim(); commit(); renderMe(); toast("Saved"); });
}
function bindRange(root){ const r=root.querySelector("#p-size"); if(!r) return;
  r.addEventListener("input",e=>{ S.prefs.size=+e.target.value; applyPrefs(); r.closest(".set").querySelector(".lab span").textContent=S.prefs.size+"px"; clearTimeout(bindRange.t); bindRange.t=setTimeout(commit,400); }); }

const hostTheme=document.documentElement.getAttribute("data-theme");
function applyPrefs(){
  const r=document.documentElement; r.style.setProperty("--read-size",S.prefs.size+"px"); r.style.setProperty("--read-lh",S.prefs.lh);
  const t=S.prefs.theme; if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else if(hostTheme) r.setAttribute("data-theme",hostTheme); else r.removeAttribute("data-theme");
  const m=document.querySelector('meta[name="theme-color"]:not([media])') ; const bg=getComputedStyle(r).getPropertyValue("--bg").trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(x=>x.setAttribute("content",bg));
}

/* ---------- sheets ---------- */
let sheetEl=null, scrimEl=null;
function openSheet(html,{tall=false,onMount}={}){
  closeSheet(true);
  scrimEl=document.createElement("div"); scrimEl.className="scrim"; scrimEl.dataset.act="closesheet";
  sheetEl=document.createElement("div"); sheetEl.className="sheet"+(tall?" tall":""); sheetEl.setAttribute("role","dialog"); sheetEl.setAttribute("aria-modal","true");
  sheetEl.innerHTML=`<div class="grab"><i></i></div><div class="body"><div class="wrap">${html}</div></div>`;
  document.body.append(scrimEl,sheetEl); document.body.classList.add("lock");
  requestAnimationFrame(()=>{ scrimEl.classList.add("in"); sheetEl.classList.add("in"); });
  // drag to dismiss
  const g=sheetEl.querySelector(".grab"); let sy=0,dy=0,drag=false;
  g.addEventListener("touchstart",e=>{ drag=true; sy=e.touches[0].clientY; dy=0; sheetEl.style.transition="none"; },{passive:true});
  g.addEventListener("touchmove",e=>{ if(!drag) return; dy=Math.max(0,e.touches[0].clientY-sy); sheetEl.style.transform=`translateY(${dy}px)`; },{passive:true});
  g.addEventListener("touchend",()=>{ if(!drag) return; drag=false; sheetEl.style.transition=""; sheetEl.style.transform=""; if(dy>90) closeSheet(); });
  if(onMount) onMount(sheetEl);
}
function closeSheet(instant){
  const s=sheetEl,c=scrimEl; sheetEl=scrimEl=null; document.body.classList.remove("lock"); if(!s) return;
  if(instant){ s.remove(); c.remove(); return; }
  s.classList.remove("in"); c.classList.remove("in"); setTimeout(()=>{ s.remove(); c.remove(); },320);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(sheetEl) closeSheet(); else clearSel(); } });
function noteSheet(v){
  const {b,c}=S.last, k=key(b,c,v), n=S.notes[k];
  openSheet(`<h3>${esc(ref(b,c,v))}</h3><div class="q">${fmt(vtext(b,c,v))}</div>
    <textarea class="input" id="note-t" maxlength="3000" placeholder="What is this verse saying to you?" aria-label="Your note">${esc(n?n.t:"")}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn pri" data-act="savenote" data-v="${v}">Save note</button>${n?`<button class="btn" data-act="delnote" data-v="${v}">Delete</button>`:""}</div>`,
    {onMount:s=>setTimeout(()=>{ const t=s.querySelector("#note-t"); if(t) t.focus(); },340)});
}
function pickerSheet(stage,bSel,filter){
  const {b,c}=S.last;
  if(stage==="ch"){
    openSheet(`<div class="row between"><h3>${esc(bname(bSel))}</h3><button class="btn sm" data-act="picker">${I.prev}Books</button></div>
      <div class="chs">${Array.from({length:nch(bSel)},(_,i)=>i+1).map(n=>`<button class="ch ${S.read[key(bSel,n)]?"read":""} ${bSel===b&&n===c?"cur":""}" data-act="pickch" data-b="${bSel}" data-c="${n}">${n}</button>`).join("")}</div>
      <p class="small muted" style="margin-top:14px">A gold dot marks chapters you've read.</p>`,{tall:true}); return;
  }
  const t=stage||(b<NT?"ot":"nt");
  openSheet(`<div class="searchf">${I.search}<input class="input" id="bookq" placeholder="Find a book" autocomplete="off" aria-label="Find a book"></div>
    <div class="seg" style="margin-top:12px" id="tseg"><button data-act="pickt" data-t="ot" aria-pressed="${t==="ot"}">Old Testament</button><button data-act="pickt" data-t="nt" aria-pressed="${t==="nt"}">New Testament</button></div>
    <div class="books" id="booklist"></div>`,{tall:true,onMount:s=>{
      const draw=()=>{ const q=s.querySelector("#bookq").value.trim().toLowerCase(); const tt=s.querySelector('#tseg [aria-pressed="true"]').dataset.t;
        const L=BIBLE.map((x,i)=>i).filter(i=> q ? bname(i).toLowerCase().includes(q) : (tt==="ot"?i<NT:i>=NT));
        s.querySelector("#tseg").hidden=!!q;
        s.querySelector("#booklist").innerHTML=L.map(i=>`<button class="bk ${i===b?"cur":""}" data-act="pickbook" data-b="${i}">${esc(bname(i))}<span>${nch(i)} ch</span></button>`).join("") || `<p class="muted">No book by that name.</p>`; };
      s.querySelector("#bookq").addEventListener("input",draw); s._draw=draw; draw();
      const cur=s.querySelector(".bk.cur"); if(cur) setTimeout(()=>cur.scrollIntoView({block:"center"}),50);
    }});
}

/* ---------- onboarding ---------- */
let obStep=0, obEl=null;
function openOnboarding(){ obEl=document.createElement("div"); obEl.className="ob"; obEl.setAttribute("role","dialog"); obEl.setAttribute("aria-label","Welcome"); document.body.appendChild(obEl); document.body.classList.add("lock"); renderOb(); }
function closeOnboarding(){ if(obEl){ obEl.remove(); obEl=null; document.body.classList.remove("lock"); } }
function renderOb(){
  if(!obEl) return; const dots=`<div class="dots">${[0,1,2].map(i=>`<i class="${i<=obStep?"on":""}"></i>`).join("")}</div>`;
  let h="";
  if(obStep===0) h=`${dots}<img class="mark" src="icon-192.png" alt=""><h1 style="margin-top:0">A Bible that's <em>yours</em>.</h1><p class="lead">A daily verse chosen for you, a plan to keep you reading, and a place for your highlights and notes.</p>
    <label class="eyebrow" for="ob-name">What should we call you?</label><input class="input" id="ob-name" style="margin-top:10px" placeholder="First name" autocomplete="given-name" maxlength="40" value="${esc(S.profile.name)}" enterkeyhint="next">
    <div class="foot"><button class="btn pri block" data-act="ob-next">Continue</button></div>`;
  else if(obStep===1) h=`${dots}<h1>What would you like to grow in${S.profile.name?`, <em>${esc(S.profile.name)}</em>`:""}?</h1><p class="lead">Your verse of the day will come from these. Pick as many as you like.</p>
    <div class="chips">${TOPICS.map(t=>`<button class="chip" data-act="ob-topic" data-t="${t}" aria-pressed="${S.profile.topics.includes(t)}">${t}</button>`).join("")}</div>
    <div class="foot"><button class="btn pri block" data-act="ob-next">Continue</button><button class="skip" data-act="ob-back">Back</button></div>`;
  else h=`${dots}<h1>Choose a reading plan</h1><p class="lead">A few chapters a day, ticked off as you go. You can change this any time.</p>
    <div class="opts">${BIBLE?planOpts("ob-plan", S.plan&&S.plan.id):'<p class="muted">Loading plans…</p>'}</div>
    <div class="foot"><button class="btn pri block" data-act="ob-done">${S.plan?"Start reading":"Start without a plan"}</button><button class="skip" data-act="ob-back">Back</button></div>`;
  obEl.innerHTML=`<div class="wrap">${h}</div>`;
  const n=obEl.querySelector("#ob-name"); if(n) n.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); obEl.querySelector('[data-act="ob-next"]').click(); } });
}

/* ---------- backup ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify({app:"my-bible",version:2,exported:new Date().toISOString(),data:S},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`my-bible-backup-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast("Backup saved to your downloads");
}
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const j=JSON.parse(await f.text()); const d=j&&j.app==="my-bible"?j.data:null; if(!d) throw 0; S=hydrate(d); S.onboarded=true; commit(); applyPrefs(); renderAll(); toast("Backup restored"); }
  catch(err){ toast("That file isn't a My Bible backup"); }
});

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, d=t.dataset, B=+d.b, C=+d.c, V=+d.v;
  switch(a){
    case "tab": closeSheet(true); if(d.v===view) window.scrollTo({top:0,behavior:"smooth"}); else { nav(d.v); window.scrollTo(0,0); } break;
    case "open": closeSheet(true); openChapter(B,C,d.v?V:null); break;
    case "prev": step(-1); break;
    case "next": step(1); break;
    case "picker": pickerSheet(); break;
    case "pickt": if(sheetEl){ sheetEl.querySelectorAll("#tseg button").forEach(x=>x.setAttribute("aria-pressed",x===t)); sheetEl._draw(); } break;
    case "pickbook": if(nch(B)===1){ closeSheet(); openChapter(B,1); } else pickerSheet("ch",B); break;
    case "pickch": closeSheet(); openChapter(B,C); break;
    case "textsheet": openSheet(`<h3 style="margin-bottom:8px">Reading</h3>${textControls()}`,{onMount:bindRange}); break;
    case "closesheet": closeSheet(); break;
    case "verse": { if(e.target.closest(".nmk")) break; const v=V; if(sel.has(v)){ sel.delete(v); t.classList.remove("sel"); } else { sel.add(v); t.classList.add("sel"); buzz(); } renderFab(); break; }
    case "clearsel": clearSel(); break;
    case "hl": { const {b,c}=S.last; sel.forEach(v=>{ const k=key(b,c,v); if(d.c) S.hl[k]={c:d.c,t:Date.now()}; else delete S.hl[k]; }); commit(); buzz(); sel.clear(); renderRead(); renderFab(); break; }
    case "bm": { const {b,c}=S.last, ks=[...sel].map(v=>key(b,c,v)), all=ks.every(k=>S.bm[k]); ks.forEach(k=>{ if(all) delete S.bm[k]; else S.bm[k]={t:Date.now()}; }); commit(); toast(all?"Bookmark removed":"Bookmarked"); sel.clear(); renderRead(); renderFab(); break; }
    case "copysel": copyText(passageText(S.last.b,S.last.c,sel)); clearSel(); break;
    case "sharesel": shareText(passageText(S.last.b,S.last.c,sel)); clearSel(); break;
    case "opennote": e.stopPropagation(); noteSheet(V); break;
    case "savenote": { const k=key(S.last.b,S.last.c,V), txt=$("#note-t").value.trim(); if(txt) S.notes[k]={t:txt,ts:Date.now()}; else delete S.notes[k]; commit(); closeSheet(); clearSel(); renderRead(); toast(txt?"Note saved":"Note removed"); break; }
    case "delnote": delete S.notes[key(S.last.b,S.last.c,V)]; commit(); closeSheet(); clearSel(); renderRead(); toast("Note deleted"); break;
    case "sharev": shareText(`“${vtext(B,C,V)}”\n— ${ref(B,C,V)} (BSB)`); break;
    case "markread": { const {b,c}=S.last, on=!S.read[key(b,c)]; setRead(b,c,on); buzz(); renderRead(); if(on){ const s=streak(); toast(s>1?`${s}-day streak. Keep going.`:"Marked as read"); } break; }
    case "toggleread": { const on=!S.read[key(B,C)]; setRead(B,C,on); buzz(); renderToday(); break; }
    case "startplan": S.plan={id:d.id,start:today()}; commit(); renderToday(); toast("Plan started"); break;
    case "pickplan": planConfirm=(S.plan&&S.plan.id===d.id)?null:d.id; renderMe(); break;
    case "confirmplan": S.plan={id:planConfirm,start:today()}; planConfirm=null; commit(); renderMe(); toast("Plan started"); break;
    case "cancelplan": planConfirm=null; renderMe(); break;
    case "stopplan": S.plan=null; commit(); renderMe(); toast("Plan stopped"); break;
    case "topic": { const i=S.profile.topics.indexOf(d.t); if(i>=0) S.profile.topics.splice(i,1); else S.profile.topics.push(d.t); t.setAttribute("aria-pressed",i<0); commit(); break; }
    case "pref": { const k=d.k, v=(k==="lh"||k==="rate")?+d.v:d.v; S.prefs[k]=v; applyPrefs(); commit();
      document.querySelectorAll(`[data-act="pref"][data-k="${k}"]`).forEach(x=>x.setAttribute("aria-pressed", x.dataset.v===d.v));
      if(k==="font") document.querySelectorAll(".sample").forEach(s=>s.classList.toggle("sans",v==="sans"));
      if(view==="read" && (k==="font"||k==="layout")) renderRead(); break; }
    case "scope": SQ.scope=d.s; renderSearch(); break;
    case "try": $("#q").value=d.q; SQ.q=d.q; runSearch(true); break;
    case "savedtab": savedTab=d.t; renderSaved(); break;
    case "listen": if(speaking) stopListen(); else startListen(sel.size?Math.min(...sel):1); clearSel(); break;
    case "pauselisten": if(!speaking) break; if(speaking.paused){ speaking.paused=false; speakNext(); } else { speaking.paused=true; speechSynthesis.cancel(); renderPlayer(); } break;
    case "stoplisten": stopListen(); break;
    case "install": if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; renderToday(); }); } break;
    case "hideinstall": S.installHidden=true; commit(); renderToday(); break;
    case "export": exportData(); break;
    case "import": $("#importFile").click(); break;
    case "retry": loadBible(); break;
    case "ob-next": if(obStep===0){ const n=$("#ob-name"); S.profile.name=n?n.value.trim():""; } obStep++; renderOb(); break;
    case "ob-back": obStep=Math.max(0,obStep-1); renderOb(); break;
    case "ob-topic": { const i=S.profile.topics.indexOf(d.t); if(i>=0) S.profile.topics.splice(i,1); else S.profile.topics.push(d.t); t.setAttribute("aria-pressed",i<0); buzz(); break; }
    case "ob-plan": S.plan=(S.plan&&S.plan.id===d.id)?null:{id:d.id,start:today()}; renderOb(); break;
    case "ob-done": S.onboarded=true; commit(); closeOnboarding(); renderAll(); window.scrollTo(0,0); toast(S.profile.name?`Welcome, ${S.profile.name}`:"Welcome"); break;
  }
});
// tap outside verses clears selection
document.addEventListener("click",e=>{ if(sel.size && !e.target.closest(".v,#fab,.sheet,.scrim,.top,.player")) clearSel(); },true);

/* ---------- boot ---------- */
async function loadBible(){
  loadErr=""; renderAll();
  try{ const r=await fetch("bsb.json"); if(!r.ok) throw new Error(r.status); BIBLE=await r.json(); flat=null; }
  catch(e){ loadErr="Couldn't load the Bible text. Check your connection and try again."; }
  renderAll(); if(obEl) renderOb();
}
applyPrefs();
go(location.hash.slice(1)||"today");
if(!S.onboarded) openOnboarding();
loadBible();
initCloud();
if(!FRAMED && "serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",applyPrefs);
})();
</script>
